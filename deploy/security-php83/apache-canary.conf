Listen 127.0.0.1:18000

<VirtualHost 127.0.0.1:18000>
    ServerName localhost
    DocumentRoot /var/www/apinotaris/public
    <Directory /var/www/apinotaris/public>
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch ".+\.ph(ar|p|tml)$">
        SetHandler "proxy:fcgi://127.0.0.1:19000"
    </FilesMatch>
</VirtualHost>

Listen 127.0.0.1:18082

<VirtualHost 127.0.0.1:18082>
    ServerName localhost
    DocumentRoot /var/www/notaris.com
    <Directory /var/www/notaris.com>
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch ".+\.ph(ar|p|tml)$">
        SetHandler "proxy:fcgi://127.0.0.1:19000"
    </FilesMatch>
</VirtualHost>
