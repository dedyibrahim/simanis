<FilesMatch ".+\.ph(ar|p|tml)$">
    SetHandler "proxy:fcgi://127.0.0.1:19000"
</FilesMatch>

<FilesMatch ".+\.phps$">
    Require all denied
</FilesMatch>

<FilesMatch "^\.ph(ar|p|ps|tml)$">
    Require all denied
</FilesMatch>

<FilesMatch "^\.user\.ini$">
    Require all denied
</FilesMatch>

