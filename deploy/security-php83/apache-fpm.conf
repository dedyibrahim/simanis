        Require all denied
    </FilesMatch>
</Directory>

<Directory "/var/www/apinotaris/public/assets/berkasnotaris">
    <FilesMatch ".+\.ph(ar|p|tml)$">
        Require all denied
    </FilesMatch>
</Directory>

<Directory "/var/www/notaris.com/berkas">
