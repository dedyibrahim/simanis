version: "3.4"
services:
  bothwa:
    image: bothwa:latest
    container_name: bothwa
    restart: unless-stopped
    env_file:
      - bothwa.env
    ports:
      - "8020:8020"
    depends_on:
      - waha

  waha:
    image: devlikeapro/waha:latest
    container_name: simanis-waha
    restart: unless-stopped
    ports:
      - "8010:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=GOWS
      - WAHA_SESSION_CONFIG_IGNORE_STATUS=true
      - WAHA_SESSION_CONFIG_IGNORE_GROUPS=true
      - WAHA_SESSION_CONFIG_IGNORE_CHANNELS=true
      - WAHA_SESSION_CONFIG_IGNORE_BROADCAST=true
      - WAHA_API_KEY=admin
      - WAHA_NO_API_KEY=False
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:?set WAHA_DASHBOARD_PASSWORD}
      - WAHA_PRINT_QR=true
      - WAHA_AUTO_START_DELAY_SECONDS=0
      - WHATSAPP_RESTART_ALL_SESSIONS=true
    volumes:
      - ./sessions:/app/.sessions
